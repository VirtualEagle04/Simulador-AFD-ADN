name: Build Windows application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress --yes
          $wixTool = Get-ChildItem `
            -Path "${env:ProgramFiles(x86)}\WiX Toolset*", "${env:ProgramFiles}\WiX Toolset*", "${env:ChocolateyInstall}\lib\wixtoolset*\tools" `
            -Include candle.exe, wix.exe `
            -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wixTool) {
            throw 'WiX was installed but no WiX executable was found.'
          }
          $wixTool.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/classes | Out-Null
          $sources = Get-ChildItem -Path src -Recurse -Filter *.java | Select-Object -ExpandProperty FullName
          javac -d build/classes $sources
          jar --create --file build/SimuladorAFDADN.jar -C build/classes .

      - name: Create portable application image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          jpackage `
            --type app-image `
            --input build `
            --name SimuladorAFDADN `
            --main-jar SimuladorAFDADN.jar `
            --main-class afdpainter.Main `
            --dest artifacts
          Compress-Archive -Path artifacts/SimuladorAFDADN -DestinationPath artifacts/SimuladorAFDADN-portable-windows.zip

      - name: Create Windows installer
        shell: pwsh
        run: |
          jpackage `
            --type exe `
            --input build `
            --name SimuladorAFDADN `
            --main-jar SimuladorAFDADN.jar `
            --main-class afdpainter.Main `
            --app-version 1.0.${{ github.run_number }} `
            --win-shortcut `
            --win-menu `
            --dest artifacts

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "build-${{ github.run_number }}"
          $assets = Get-ChildItem artifacts -File |
            Where-Object { $_.Extension -in '.exe', '.zip' } |
            Select-Object -ExpandProperty FullName
          gh release create $tag @assets `
            --title "Simulador AFD y AFN $tag" `
            --notes "Build automática generada desde el commit ${{ github.sha }}."

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimuladorAFDADN-windows
          path: artifacts/*